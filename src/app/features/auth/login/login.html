<div class="login-container">

  <div class="brand-side">
    <h1>Estud-io</h1>
  </div>

  <div class="form-side">
    <div class="top-bar">
      <app-language-select></app-language-select>
    </div>

    <mat-card class="login-card">
      <h2>{{ 'login.title' | translate }}</h2>

      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'login.email' | translate }}</mat-label>
          <input matInput [(ngModel)]="email" name="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'login.password' | translate }}</mat-label>
          <input matInput [(ngModel)]="password" name="password" type="password" />
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width" [disabled]="loading || (!email || !password)">
          {{ 'login.button' | translate }}
        </button>
      </form>

      <div class="extra">
         <button mat-raised-button color="primary" class="full-width">
          <a routerLink="/register">{{ 'login.createAccount' | translate }}</a>
        </button>
      </div>

      <app-error-message [message]="error"></app-error-message>
    </mat-card>
  </div>

</div>
