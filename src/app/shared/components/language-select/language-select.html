<mat-select
  class="lang-chip"
  [value]="languageService.getCurrentLanguage()"
  (selectionChange)="changeLanguage($event.value)"
>
  <mat-select-trigger>
    <div class="chip-content">
      <img [src]="selectedLanguage?.flag" class="flag" alt="" />
      <span>{{ selectedLanguage?.label }}</span>
    </div>
  </mat-select-trigger>

  @for (lang of languages; track lang.code) {
    <mat-option [value]="lang.code">
      <div class="option-content">
        <img [src]="lang.flag" class="flag" alt="" />
        <span>{{ lang.label }}</span>
      </div>
    </mat-option>
  }
</mat-select>
